name: convstack-dashboard

services:
  # Authentik is not part of this stack - run convstack/deploy/authentik
  # separately first (it publishes port 9000 on the host), so the blueprint
  # and version pin stay in one place instead of drifting across two files.
  #
  # Authentik bakes whatever Host header a request used into its OIDC
  # discovery document. dashboard fetches discovery via IDP_INTERNAL_URL
  # (container-reachable) and rewrites the browser-facing endpoints to the
  # public IDP_URL before handing them to the browser - see
  # src/lib/oidc-discovery.ts. Token requests to the internal address carry
  # the public Host, so tokens name the public issuer lanyard's IDP_ISSUER
  # expects. LANYARD_BASE_URL is where lanyard registers its own pages, so
  # it has to be reachable from the dashboard container.
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LANYARD_URL: http://lanyard:3000
      DASHBOARD_URL: http://localhost:4000
      DASHBOARD_CLIENT_ID: convstack-dashboard
      DASHBOARD_CLIENT_SECRET: ${DASHBOARD_CLIENT_SECRET:?DASHBOARD_CLIENT_SECRET is required}
      IDP_URL: http://localhost:9000
      IDP_INTERNAL_URL: http://host.docker.internal:9000
      IDP_APP_SLUG: convstack
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PORT: 4000
      NODE_ENV: development
    depends_on:
      lanyard:
        condition: service_started

  lanyard:
    build:
      context: ../../../lanyard
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://lanyard:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/lanyard
      APP_NAME: Lanyard
      LANYARD_BASE_URL: http://lanyard:3000
      NODE_ENV: development
      IDP_ISSUER: http://localhost:9000/application/o/convstack/
      IDP_AUDIENCE: convstack-dashboard
      IDP_JWKS_URI: http://host.docker.internal:9000/application/o/convstack/jwks/
      IDP_API_URL: http://host.docker.internal:9000
      IDP_API_TOKEN: ${IDP_API_TOKEN:?IDP_API_TOKEN is required}
      IDP_SCIM_TOKEN: ${IDP_SCIM_TOKEN:?IDP_SCIM_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lanyard
      POSTGRES_USER: lanyard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanyard -d lanyard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
